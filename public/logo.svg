<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Subtle soft cast drop shadow for realistic 3D badge depth -->
    <filter id="gcc-badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" floodColor="#051428" floodOpacity="0.32" />
    </filter>

    <!-- Inner 3D depth for letters and swooshes -->
    <filter id="gcc-emboss-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3.5" stdDeviation="2.8" floodColor="#041224" floodOpacity="0.35" />
    </filter>

    <!-- Luminous clean radial background -->
    <radialGradient id="gcc-disc-bg" cx="48%" cy="44%" r="68%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="78%" stopColor="#f8fafd" />
      <stop offset="100%" stopColor="#e3ebf5" />
    </radialGradient>

    <!-- Deep Navy Blue Tone -->
    <linearGradient id="gcc-deep-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#081E38" />
      <stop offset="50%" stopColor="#0B2748" />
      <stop offset="100%" stopColor="#051528" />
    </linearGradient>

    <!-- Upper Text Arc: Sweeps clockwise over top from ~9:45 to ~2:15 -->
    <path id="gcc-upper-text-arc" d="M 80,250 A 175,175 0 1,1 420,250" fill="none" />

    <!-- Lower Text Arc: Sweeps left-to-right along bottom curve from ~7:30 to ~4:30 -->
    <path id="gcc-lower-text-arc" d="M 106,270 A 166,166 0 0,0 394,270" fill="none" />
  </defs>

  <!-- Base White Circular Seal with 3D Shadow - Radius 224 (leaves clean 26px padding) -->
  <circle cx="250" cy="250" r="224" fill="url(#gcc-disc-bg)" filter="url(#gcc-badge-shadow)" />

  <!-- Outer Heavy Circular Navy Ring -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="#081E38" stroke-width="8.5" />

  <!-- Secondary Concentric Accent Ring -->
  <circle cx="250" cy="250" r="211" fill="none" stroke="#081E38" stroke-width="2.2" />

  <!-- Inner Central Area Dividing Guide Ring -->
  <circle cx="250" cy="250" r="148" fill="none" stroke="#081E38" stroke-width="2.4" opacity="0.28" />

  <!-- UPPER TEXT: GENIUS COACHING CENTRE -->
  <text
    font-family="'Outfit', 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif"
    font-size="28.5"
    font-weight="900"
    fill="#081E38"
    letter-spacing="2.8"
  >
    <textPath href="#gcc-upper-text-arc" startOffset="50%" text-anchor="middle">
      GENIUS COACHING CENTRE
    </textPath>
  </text>

  <!-- LOWER TEXT: Bhabua (kaimur) -->
  <text
    font-family="'Comfortaa', 'Quicksand', 'Nunito', 'Plus Jakarta Sans', system-ui, sans-serif"
    font-size="26.5"
    font-weight="700"
    fill="#081E38"
    letter-spacing="2.2"
  >
    <textPath href="#gcc-lower-text-arc" startOffset="50%" text-anchor="middle">
      Bhabua (kaimur)
    </textPath>
  </text>

  <!-- Lower Arc Underline Accent Bracket -->
  <path d="M 120,385 A 155,155 0 0,0 380,385" fill="none" stroke="#081E38" stroke-width="2.4" stroke-linecap="round" />

  <!-- LEFT LAUREL WHEAT BRANCH -->
  <g fill="#081E38" stroke="#081E38">
    <path d="M 72,360 C 58,320 54,280 58,220" fill="none" stroke-width="2.8" stroke-linecap="round" />
    <line x1="53" y1="214" x2="68" y2="216" stroke-width="2.8" stroke-linecap="round" />
    <line x1="68" y1="364" x2="80" y2="368" stroke-width="2.8" stroke-linecap="round" />

    <ellipse cx="54" cy="225" rx="4.5" ry="10" transform="rotate(-15 54 225)" />
    <ellipse cx="64" cy="233" rx="4.5" ry="10" transform="rotate(35 64 233)" />
    <ellipse cx="53" cy="248" rx="5" ry="11" transform="rotate(-20 53 248)" />
    <ellipse cx="64" cy="256" rx="5" ry="11" transform="rotate(30 64 256)" />
    <ellipse cx="54" cy="272" rx="5.5" ry="11.5" transform="rotate(-25 54 272)" />
    <ellipse cx="66" cy="280" rx="5.5" ry="11.5" transform="rotate(25 66 280)" />
    <ellipse cx="57" cy="297" rx="5.5" ry="11.5" transform="rotate(-30 57 297)" />
    <ellipse cx="70" cy="304" rx="5.5" ry="11.5" transform="rotate(20 70 304)" />
    <ellipse cx="62" cy="322" rx="5.5" ry="11.5" transform="rotate(-35 62 322)" />
    <ellipse cx="76" cy="328" rx="5.5" ry="11.5" transform="rotate(15 76 328)" />
    <ellipse cx="70" cy="346" rx="6" ry="11.5" transform="rotate(-40 70 346)" />
    <ellipse cx="85" cy="350" rx="6" ry="11.5" transform="rotate(10 85 350)" />
  </g>

  <!-- RIGHT LAUREL WHEAT BRANCH -->
  <g fill="#081E38" stroke="#081E38">
    <path d="M 428,360 C 442,320 446,280 442,220" fill="none" stroke-width="2.8" stroke-linecap="round" />
    <line x1="447" y1="214" x2="432" y2="216" stroke-width="2.8" stroke-linecap="round" />
    <line x1="432" y1="364" x2="420" y2="368" stroke-width="2.8" stroke-linecap="round" />

    <ellipse cx="446" cy="225" rx="4.5" ry="10" transform="rotate(15 446 225)" />
    <ellipse cx="436" cy="233" rx="4.5" ry="10" transform="rotate(-35 436 233)" />
    <ellipse cx="447" cy="248" rx="5" ry="11" transform="rotate(20 447 248)" />
    <ellipse cx="436" cy="256" rx="5" ry="11" transform="rotate(-30 436 256)" />
    <ellipse cx="446" cy="272" rx="5.5" ry="11.5" transform="rotate(25 446 272)" />
    <ellipse cx="434" cy="280" rx="5.5" ry="11.5" transform="rotate(-25 434 280)" />
    <ellipse cx="443" cy="297" rx="5.5" ry="11.5" transform="rotate(30 443 297)" />
    <ellipse cx="430" cy="304" rx="5.5" ry="11.5" transform="rotate(-20 430 304)" />
    <ellipse cx="438" cy="322" rx="5.5" ry="11.5" transform="rotate(35 438 322)" />
    <ellipse cx="424" cy="328" rx="5.5" ry="11.5" transform="rotate(-15 424 328)" />
    <ellipse cx="430" cy="346" rx="6" ry="11.5" transform="rotate(40 430 346)" />
    <ellipse cx="415" cy="350" rx="6" ry="11.5" transform="rotate(-10 415 350)" />
  </g>

  <!-- CENTRAL GCC MONOGRAM & DYNAMIC DUAL ORBITAL SWOOSHES -->
  <g filter="url(#gcc-emboss-shadow)">
    <!-- Top Outer Swoosh -->
    <path
      d="M 166,212 C 185,150 310,132 366,180 C 342,154 225,145 170,200 Z"
      fill="url(#gcc-deep-navy)"
    />
    <!-- Top Inner Accent Swoosh -->
    <path
      d="M 188,198 C 206,160 294,150 338,178 C 318,160 230,154 192,192 Z"
      fill="#0B2748"
      opacity="0.92"
    />

    <!-- Bottom Outer Swoosh -->
    <path
      d="M 334,288 C 315,350 190,368 134,320 C 158,346 275,355 330,300 Z"
      fill="url(#gcc-deep-navy)"
    />
    <!-- Bottom Inner Accent Swoosh -->
    <path
      d="M 312,302 C 294,340 206,350 162,322 C 182,340 270,346 308,308 Z"
      fill="#0B2748"
      opacity="0.92"
    />

    <!-- Letter G -->
    <path
      d="M 194,215 C 188,202 176,194 150,194 C 118,194 96,216 96,250 C 96,284 118,306 152,306 C 178,306 192,296 196,278 L 150,278 L 150,258 L 208,258 L 208,293 C 198,312 176,322 148,322 C 102,322 76,292 76,250 C 76,208 102,178 150,178 C 182,178 203,192 210,215 Z"
      fill="url(#gcc-deep-navy)"
    />
    <!-- 3 Speed Slashes on G -->
    <polygon points="124,185 146,185 136,202 114,202" fill="#ffffff" />
    <polygon points="142,185 164,185 154,202 132,202" fill="#ffffff" />

    <!-- Letter C (first) -->
    <path
      d="M 310,215 C 304,200 288,194 266,194 C 236,194 216,216 216,250 C 216,284 236,306 266,306 C 288,306 304,296 310,280 L 328,288 C 318,312 296,322 264,322 C 222,322 196,290 196,250 C 196,208 222,178 266,178 C 296,178 320,190 328,215 Z"
      fill="url(#gcc-deep-navy)"
    />

    <!-- Letter C (second) -->
    <path
      d="M 404,215 C 398,200 382,194 360,194 C 330,194 310,216 310,250 C 310,284 330,306 360,306 C 382,306 398,296 404,280 L 422,288 C 412,312 390,322 358,322 C 316,322 290,290 290,250 C 290,208 316,178 360,178 C 390,178 414,190 422,215 Z"
      fill="url(#gcc-deep-navy)"
    />

    <!-- Horizontal Equator Slit Across G, C, C -->
    <rect x="73" y="247" width="354" height="6.5" fill="#ffffff" />
  </g>
</svg>
